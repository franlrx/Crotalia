{% extends 'ganaderia/base.html' %}

{% block content %}
    <div class="encabezado-lista">
        <h2>Panel de Control - {{ nombre_granja }}</h2>
    </div>

    <!-- CUADRÍCULA DE ESTADÍSTICAS -->
    <div class="dashboard-grid">
        
        <!-- Tarjeta 1: Censo Total -->
        <div class="tarjeta-stat">
            <div class="tarjeta-stat-icono">🐮</div>
            <div class="tarjeta-stat-titulo">Censo Activo</div>
            <div class="tarjeta-stat-valor valor-azul">{{ total_vacas }}</div>
        </div>

        <!-- Tarjeta 2: Partos del Mes -->
        <div class="tarjeta-stat">
            <div class="tarjeta-stat-icono">🍼</div>
            <div class="tarjeta-stat-titulo">Partos Este Mes</div>
            <div class="tarjeta-stat-valor valor-naranja">{{ partos_este_mes }}</div>
        </div>

        <!-- Tarjeta 3: Rendimiento Reproductivo -->
        <div class="tarjeta-stat">
            <div class="tarjeta-stat-icono">📈</div>
            <div class="tarjeta-stat-titulo">Éxito Inseminaciones</div>
            <div class="tarjeta-stat-valor valor-verde">{{ tasa_exito }}%</div>
        </div>
        
    </div>

{% endblock %}
