{% extends 'ganaderia/base.html' %}

{% block content %}
<div class="contenedor-formulario">
    <h2 class="titulo-formulario">🔒 Cambiar Contraseña</h2>
    
    <form method="POST" class="formulario-estilizado">
        {% csrf_token %}
        
        <!-- Django renderiza los campos automáticamente con sus validaciones de seguridad -->
        {{ form.as_p }}

        <div class="acciones-formulario">
            <a href="{% url 'ganaderia:inicio' %}" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-accion btn-añadir">Actualizar Contraseña</button>
        </div>
    </form>
</div>
{% endblock %}
